services:
  postgresql-personal:
    image: postgres:18.6
    container_name: postgresql-personal-18-6
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: postgres_personal
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    volumes:
      - postgresql-personal_data:/var/lib/postgresql

volumes:
  postgresql-personal_data:
    name: postgresql-personal-18-6-data
