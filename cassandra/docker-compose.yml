services:
  cassandra-personal:
    image: cassandra:5.0.9
    container_name: cassandra-personal-5-0-9
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: Cassandra Personal
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
    volumes:
      - cassandra-personal_data:/var/lib/cassandra

volumes:
  cassandra-personal_data:
    name: cassandra-personal-5-0-9-data
