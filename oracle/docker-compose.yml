services:
  oracle-personal:
    image: gvenzl/oracle-free:23.26.3
    container_name: oracle-personal-23-26-3
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: pass_admin
      APP_USER: user
      APP_USER_PASSWORD: pass
    volumes:
      - oracle-personal_data:/opt/oracle/oradata

volumes:
  oracle-personal_data:
    name: oracle-personal-23-26-3-data
